[project]
name = "nipstack-core"
version = "0.1.0"
description = "Python library for network data collection, parsing, and structured observations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nipstack_core"]
exclude = ["**/AGENTS.md"]
