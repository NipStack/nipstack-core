name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests (including forks) only need permission to read the source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and locked dependencies
        run: |
          uv python install "$UV_PYTHON"
          uv sync --locked --python "$UV_PYTHON"

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy

      - name: pytest
        run: uv run --no-sync pytest -q

  package:
    name: Build and install wheel (Python 3.12)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and sdist
        run: |
          uv python install 3.12
          uv build --python 3.12

      - name: Verify distribution files
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected exactly one wheel, got {wheels}"
          assert len(sdists) == 1, f"Expected exactly one sdist, got {sdists}"
          with ZipFile(wheels[0]) as archive:
              members = archive.namelist()
              assert "nipstack_core/py.typed" in members
              assert "nipstack_core/contracts/feature_selection.py" in members
              assert "nipstack_core/contracts/errors.py" in members
              assert not any(item.endswith("/AGENTS.md") for item in members)
          with tarfile.open(sdists[0], "r:gz") as archive:
              source_members = archive.getnames()
              assert any(
                  item.endswith("/src/nipstack_core/contracts/feature_selection.py")
                  for item in source_members
              )
              assert any(
                  item.endswith("/src/nipstack_core/py.typed")
                  for item in source_members
              )
          for names in (members, source_members):
              assert not any("/fakes/" in item for item in names)
          print("Wheel and sdist verified")
          PY

      - name: Smoke test installed wheel
        run: |
          uv venv --python 3.12 .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python -I - <<'PY'
          from dataclasses import FrozenInstanceError
          from importlib import resources
          from importlib.metadata import version
          from pathlib import Path
          from unittest import TestCase

          import nipstack_core
          from nipstack_core import (
              FeatureSelection,
              FeatureSelectionKind,
              NipStackCoreUsageError,
              contracts,
          )

          assert ".venv-wheel" in str(Path(nipstack_core.__file__).resolve())
          assert resources.files(nipstack_core).joinpath("py.typed").is_file()
          expected = {"FeatureSelection", "FeatureSelectionKind", "NipStackCoreUsageError"}
          assert set(nipstack_core.__all__) == set(contracts.__all__) == expected
          for name in expected:
              assert getattr(nipstack_core, name) is getattr(contracts, name)
          assert issubclass(NipStackCoreUsageError, ValueError)
          assert FeatureSelection.all().kind is FeatureSelectionKind.ALL
          assert FeatureSelection.all().values == ()
          selection = FeatureSelection.modes("config", "check", "config")
          assert selection.kind is FeatureSelectionKind.MODES
          assert selection.values == ("config", "check")
          assert selection == FeatureSelection.modes("config", "check")
          assert hash(selection) == hash(FeatureSelection.modes("config", "check"))
          features = FeatureSelection.features("custom.network.ipv6")
          assert features.kind is FeatureSelectionKind.FEATURES
          assert features.values == ("custom.network.ipv6",)
          check = TestCase()
          with check.assertRaises(TypeError):
              FeatureSelection()
          with check.assertRaises(TypeError):
              FeatureSelection(FeatureSelectionKind.ALL, ())
          with check.assertRaises(FrozenInstanceError):
              selection.values = ()
          for factory in (FeatureSelection.modes, FeatureSelection.features):
              with check.assertRaises(NipStackCoreUsageError):
                  factory()
              with check.assertRaises(NipStackCoreUsageError):
                  factory(None)
          assert not hasattr(nipstack_core, "collect")
          print("Installed nipstack-core version:", version("nipstack-core"))
          PY
